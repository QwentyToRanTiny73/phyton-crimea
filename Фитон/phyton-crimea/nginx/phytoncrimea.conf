# Nginx конфиг для Фитон Крым
# Расположение на сервере: /etc/nginx/sites-available/phytoncrimea.conf
# Активировать: ln -s /etc/nginx/sites-available/phytoncrimea.conf /etc/nginx/sites-enabled/
#
# Замените phytoncrimea.ru на ваш реальный домен перед использованием.

# Upstream — Next.js приложение
upstream nextjs_phytoncrimea {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name phytoncrimea.ru www.phytoncrimea.ru;

    # Certbot / Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://phytoncrimea.ru$request_uri;
    }
}

# Редирект www → без www (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.phytoncrimea.ru;

    ssl_certificate     /etc/letsencrypt/live/phytoncrimea.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phytoncrimea.ru/privkey.pem;

    return 301 https://phytoncrimea.ru$request_uri;
}

# Основной HTTPS-сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phytoncrimea.ru;

    # ── SSL / TLS ──────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/phytoncrimea.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phytoncrimea.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/phytoncrimea.ru/chain.pem;

    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── Заголовки безопасности ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Gzip сжатие ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Логи ───────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/phytoncrimea-access.log;
    error_log  /var/log/nginx/phytoncrimea-error.log  warn;

    # ── Лимиты ─────────────────────────────────────────────────────────────────
    client_max_body_size 10m;
    client_body_timeout  30;
    client_header_timeout 30;

    # ── Статика Next.js (_next/static) — агрессивное кэширование ──────────────
    location /_next/static/ {
        proxy_pass http://nextjs_phytoncrimea;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Immutable — версионированные файлы не меняются
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # ── Публичные статические файлы (favicon, robots.txt, images) ─────────────
    location /favicon.ico {
        proxy_pass http://nextjs_phytoncrimea;
        add_header Cache-Control "public, max-age=86400";
        log_not_found off;
    }

    location /robots.txt {
        proxy_pass http://nextjs_phytoncrimea;
        add_header Cache-Control "public, max-age=86400";
        log_not_found off;
    }

    # ── API роуты — без кэширования ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://nextjs_phytoncrimea;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  60;
        proxy_connect_timeout 10;

        add_header Cache-Control "no-store, no-cache";
    }

    # ── Все остальные запросы → Next.js ────────────────────────────────────────
    location / {
        proxy_pass http://nextjs_phytoncrimea;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout  60;
        proxy_connect_timeout 10;
        proxy_send_timeout  60;
    }
}
