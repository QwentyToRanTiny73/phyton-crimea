# Nginx конфиг для Фитон Крым
# Расположение на сервере: /etc/nginx/sites-available/phytoncrimea.conf
# Активировать: ln -s /etc/nginx/sites-available/phytoncrimea.conf /etc/nginx/sites-enabled/
#
# Поддерживает два режима:
#   A) Cloudflare Proxy  — домен → Cloudflare CDN → этот сервер (рекомендуется)
#   B) Прямой деплой     — домен → этот сервер напрямую

# Upstream — Next.js приложение
upstream nextjs_phytoncrimea {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── Режим A: Cloudflare Proxy ──────────────────────────────────────────────────
# Восстановление реального IP посетителя из заголовков Cloudflare.
# Без этого блока в логах будет IP Cloudflare, а не реального пользователя.
# Актуальные диапазоны: https://www.cloudflare.com/ips/
geo $cloudflare_ip {
    default 0;
    173.245.48.0/20   1;
    103.21.244.0/22   1;
    103.22.200.0/22   1;
    103.31.4.0/22     1;
    141.101.64.0/18   1;
    108.162.192.0/18  1;
    190.93.240.0/20   1;
    188.114.96.0/20   1;
    197.234.240.0/22  1;
    198.41.128.0/17   1;
    162.158.0.0/15    1;
    104.16.0.0/13     1;
    104.24.0.0/14     1;
    172.64.0.0/13     1;
    131.0.72.0/22     1;
    # IPv6 Cloudflare
    2400:cb00::/32    1;
    2606:4700::/32    1;
    2803:f800::/32    1;
    2405:b500::/32    1;
    2405:8100::/32    1;
    2a06:98c0::/29    1;
    2c0f:f248::/32    1;
}

# HTTP → HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name phytoncrimea.ru www.phytoncrimea.ru;

    # Let's Encrypt (нужен только при прямом деплое без Cloudflare)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://phytoncrimea.ru$request_uri;
    }
}

# Редирект www → без www (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.phytoncrimea.ru;

    ssl_certificate     /etc/letsencrypt/live/phytoncrimea.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phytoncrimea.ru/privkey.pem;

    return 301 https://phytoncrimea.ru$request_uri;
}

# Основной HTTPS-сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phytoncrimea.ru;

    # ── SSL / TLS ──────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/phytoncrimea.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phytoncrimea.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/phytoncrimea.ru/chain.pem;

    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;

    # ── Cloudflare: реальный IP посетителя ────────────────────────────────────
    # Если запрос пришёл через Cloudflare — берём IP из CF-Connecting-IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── Заголовки безопасности ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Gzip сжатие ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript
        application/xml+rss application/atom+xml
        image/svg+xml font/woff font/woff2;

    # ── Логи ───────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/phytoncrimea-access.log;
    error_log  /var/log/nginx/phytoncrimea-error.log warn;

    # ── Лимиты ─────────────────────────────────────────────────────────────────
    client_max_body_size 10m;

    # ── Next.js _next/static — агрессивное кэширование (immutable) ────────────
    location /_next/static/ {
        proxy_pass http://nextjs_phytoncrimea;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cloudflare Edge Cache: кэшировать 1 год (файлы хэшированы Next.js)
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Публичные статические файлы ────────────────────────────────────────────
    location ~* \.(ico|png|jpg|jpeg|svg|webp|woff|woff2|ttf)$ {
        proxy_pass http://nextjs_phytoncrimea;
        add_header Cache-Control "public, max-age=86400";
        log_not_found off;
    }

    # ── API роуты — без кэширования (Cloudflare не кэширует) ──────────────────
    location /api/ {
        proxy_pass http://nextjs_phytoncrimea;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cloudflare: не кэшировать API
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Cloudflare-CDN-Cache-Control "no-store";

        proxy_read_timeout  60;
        proxy_connect_timeout 10;
    }

    # ── ЮКасса Webhook — принимаем только от ЮКассы ───────────────────────────
    # Опционально: раскомментируйте для whitelist IP ЮКассы (185.71.76.0/27 и др.)
    # location /api/payment/webhook {
    #     allow 185.71.76.0/27;
    #     allow 185.71.77.0/27;
    #     deny all;
    #     proxy_pass http://nextjs_phytoncrimea;
    #     ...
    # }

    # ── Все остальные запросы → Next.js ────────────────────────────────────────
    location / {
        proxy_pass http://nextjs_phytoncrimea;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout  60;
        proxy_connect_timeout 10;
        proxy_send_timeout  60;
    }
}
