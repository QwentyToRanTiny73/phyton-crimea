# CI — сборка и проверка типов Next.js
#
# Запускается при каждом pull request и push в main.
# Проверяет что TypeScript компилируется и сборка проходит без ошибок.
#
# Деплой на VPS — см. deploy.yml (запускается только при merge в main).

name: CI — Build check

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Подавить предупреждение о загрузке шрифтов в CI (нет доступа к Google Fonts)
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build succeeded
        run: echo "✅ Сборка прошла успешно"
